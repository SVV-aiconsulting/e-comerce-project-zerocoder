server {
    listen 80;
    server_name webmarket.apernova.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Доступен только другим контейнерам Docker: frontend-адаптеры скачивают отсюда
# байты изображений и загружают их в Telegram/VK. Порт не опубликован на VPS.
server {
    listen 8080;
    server_name _;

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name webmarket.apernova.ru;

    ssl_certificate /etc/letsencrypt/live/webmarket.apernova.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmarket.apernova.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
