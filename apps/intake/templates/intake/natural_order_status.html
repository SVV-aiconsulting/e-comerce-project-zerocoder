<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обработка заказа — WebMarket</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #f3f6f2; color: #183128; }
    main { width: min(680px, calc(100% - 32px)); margin: 64px auto; }
    .card { background: white; border-radius: 20px; padding: 32px; box-shadow: 0 18px 50px #173c2a18; }
    .status { color: #52655d; }
    .answer { margin: 24px 0; padding: 18px; background: #edf7f1; border-radius: 12px; font-size: 18px; line-height: 1.5; }
    a { color: #176b45; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Обрабатываем заказ</h1>
    <p id="status" class="status">Сообщение сохранено. Проверяем данные…</p>
    <div id="answer" class="answer" hidden></div>
    <a id="continue" href="{% url 'natural-order' %}" hidden>Ответить или оформить ещё один заказ</a>
  </section>
</main>
<script>
  const statusUrl = `${window.location.pathname}?format=json`;
  const statusNode = document.getElementById("status");
  const answerNode = document.getElementById("answer");
  const continueNode = document.getElementById("continue");
  async function poll(attempt = 0) {
    try {
      const response = await fetch(statusUrl, {headers: {"Accept": "application/json"}});
      if (!response.ok) throw new Error("status request failed");
      const data = await response.json();
      if (data.complete) {
        statusNode.textContent = "Обработка завершена.";
        answerNode.textContent = data.response?.message || "Запрос обработан.";
        answerNode.hidden = false;
        continueNode.hidden = false;
        return;
      }
    } catch (_error) {
      statusNode.textContent = "Связь временно недоступна, повторяем проверку…";
    }
    if (attempt < 60) window.setTimeout(() => poll(attempt + 1), 1000);
    else statusNode.textContent = "Обработка продолжается. Обновите страницу через минуту.";
  }
  poll();
</script>
</body>
</html>
