name: Test, build and deploy WebMarket

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-webmarket-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/svv-aiconsulting/e-comerce-project-zerocoder
  DOMAIN: webmarket.apernova.ru

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webmarket
          POSTGRES_USER: webmarket
          POSTGRES_PASSWORD: webmarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webmarket -d webmarket"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      POSTGRES_DB: webmarket
      POSTGRES_USER: webmarket
      POSTGRES_PASSWORD: webmarket
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      ADAPTER_API_TOKENS: ci-adapter-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Verify Django configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: pytest apps -q

  test-frontend-adapters:
    name: ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Telegram adapter
            path: frontends/telegram_bot
          - name: VK adapter
            path: frontends/vk_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/pyproject.toml
      - name: Install adapter dependencies
        working-directory: ${{ matrix.path }}
        run: pip install -e ".[dev]"
      - name: Run adapter tests
        working-directory: ${{ matrix.path }}
        run: pytest -q

  build-and-push:
    name: Build and publish container images
    needs: [test-backend, test-frontend-adapters]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}:latest
            ${{ env.IMAGE_PREFIX }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push Telegram adapter image
        uses: docker/build-push-action@v6
        with:
          context: ./frontends/telegram_bot
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-telegram-bot:latest
            ${{ env.IMAGE_PREFIX }}-telegram-bot:${{ github.sha }}
          cache-from: type=gha,scope=telegram-bot
          cache-to: type=gha,mode=max,scope=telegram-bot
      - name: Build and push VK adapter image
        uses: docker/build-push-action@v6
        with:
          context: ./frontends/vk_bot
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-vk-bot:latest
            ${{ env.IMAGE_PREFIX }}-vk-bot:${{ github.sha }}
          cache-from: type=gha,scope=vk-bot
          cache-to: type=gha,mode=max,scope=vk-bot

  deploy:
    name: Deploy immutable release to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy by SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            REPOSITORY="${{ github.repository }}"
            DOMAIN="${{ env.DOMAIN }}"
            cd "$APP_DIR"

            test -f .env || { echo "ERROR: create production .env on VPS before deployment"; exit 1; }
            grep -qE '^DJANGO_DEBUG=False$' .env || { echo "ERROR: DJANGO_DEBUG=False is required"; exit 1; }
            grep -q "$DOMAIN" .env || { echo "ERROR: $DOMAIN must be listed in production .env"; exit 1; }

            git fetch "https://x-access-token:${{ secrets.VPS_GHCR_TOKEN }}@github.com/$REPOSITORY.git" main
            git checkout -B main FETCH_HEAD

            echo "${{ secrets.VPS_GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export WEBMARKET_IMAGE_TAG="${{ github.sha }}"
            export WEBMARKET_TELEGRAM_BOT_IMAGE_TAG="${{ github.sha }}"
            export WEBMARKET_VK_BOT_IMAGE_TAG="${{ github.sha }}"
            export COMPOSE_PROJECT_NAME=webmarket
            docker compose -f docker-compose.prod.yml pull

            mkdir -p deploy/certbot/conf deploy/certbot/www
            if [ ! -f "deploy/certbot/conf/live/$DOMAIN/fullchain.pem" ]; then
              docker compose -f docker-compose.prod.yml stop nginx || true
              docker compose -f docker-compose.prod.yml up -d --no-build db redis web
              docker run --rm -p 80:80 \
                -v "$PWD/deploy/certbot/conf:/etc/letsencrypt" \
                certbot/certbot certonly --standalone --non-interactive \
                --agree-tos --no-eff-email --email "${{ secrets.LETSENCRYPT_EMAIL }}" \
                -d "$DOMAIN"
            fi

            docker compose -f docker-compose.prod.yml up -d --no-build
            docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml exec -T web python manage.py check --deploy
            curl -fsS --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/api/health/"
            docker compose -f docker-compose.prod.yml ps
