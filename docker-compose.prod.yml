services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Это контейнерный предел, а не настройка PostgreSQL.
    mem_limit: 512m
    cpus: 0.50
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/svv-aiconsulting/e-comerce-project-zerocoder:${WEBMARKET_IMAGE_TAG:-latest}
    restart: unless-stopped
    # В продакшне используем gunicorn, а не runserver.
    # Один worker экономит RAM; два потока сохраняют обработку параллельных
    # коротких HTTP-запросов MVP на VPS с 2 CPU.
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 1 --threads 2 --worker-tmp-dir /dev/shm
      --max-requests 500 --max-requests-jitter 50 --timeout 60
    env_file:
      - .env
    mem_limit: 768m
    cpus: 1.00
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
      # Django читает .env с диска (внутри контейнера ожидается /app/.env).
      - ./.env:/app/.env:ro
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    image: ghcr.io/svv-aiconsulting/e-comerce-project-zerocoder:${WEBMARKET_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Celery по умолчанию выбирает число CPU для prefork concurrency. Для
    # небольшой VPS один последовательный consumer предотвращает swap, а
    # очередь Redis сохраняет и повторяет все поступившие события.
    command: >-
      celery -A config worker --loglevel=INFO --queues=intake
      --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100
    env_file:
      - .env
    mem_limit: 768m
    cpus: 1.00
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: ghcr.io/svv-aiconsulting/e-comerce-project-zerocoder:${WEBMARKET_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A config beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid
    env_file:
      - .env
    mem_limit: 256m
    cpus: 0.25
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/webmarket.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - media_data:/app/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://web:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  telegram_bot:
    image: ghcr.io/svv-aiconsulting/e-comerce-project-zerocoder-telegram-bot:${WEBMARKET_TELEGRAM_BOT_IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    env_file:
      - .env
    environment:
      # Внутри Docker-сети бот обращается к backend напрямую: внешний nginx
      # принудительно перенаправляет HTTP на HTTPS и не нужен для API-вызовов бота.
      BACKEND_API_BASE_URL: http://web:8000
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://nginx/api/health/')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vk_bot:
    image: ghcr.io/svv-aiconsulting/e-comerce-project-zerocoder-vk-bot:${WEBMARKET_VK_BOT_IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    env_file:
      - .env
    environment:
      BACKEND_API_BASE_URL: http://web:8000
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen(os.environ.get('BACKEND_API_BASE_URL','http://nginx') + '/api/health/')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - vk

volumes:
  postgres_data:
  redis_data:
  media_data:
